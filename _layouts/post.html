---
layout: default
---
<article class="post">
  <header class="post-head">
    <p class="dateline">
      <time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%B %-d, %Y" }}</time>
    </p>
    <h1 class="post-title">{{ page.title }}</h1>
  </header>

  <div class="post-body">
    {{ content }}
  </div>

  <footer class="post-foot">
    <p><a class="back" href="{{ '/' | relative_url }}">All columns</a></p>
  </footer>
</article>
