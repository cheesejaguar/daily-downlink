---
layout: default
---
<article class="grid" itemscope itemtype="https://schema.org/BlogPosting">
  <p class="stamp rail">
    <b><time datetime="{{ page.date | date_to_xmlschema }}" itemprop="datePublished">{{ page.date | date: "%Y-%m-%d" }}</time></b>
    {%- if page.categories.size > 0 %}<span itemprop="articleSection">{{ page.categories | join: ", " }}</span>{%- endif %}
  </p>

  <h1 class="record-title" itemprop="headline">{{ page.title }}</h1>

  <div class="body" itemprop="articleBody">
    {{ content }}
  </div>

  <footer class="record-foot">
    <p><a href="{{ '/' | relative_url }}">All passes</a></p>
  </footer>
</article>
