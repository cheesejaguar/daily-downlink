{%- assign live = site.posts | where_exp: "p", "p.draft != true" -%}
<header class="statusbar">
  <div class="grid">
    <a class="wordmark" href="{{ '/' | relative_url }}">
      <svg class="mark" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false">
        <g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 3 V13.4"/>
          <path d="M7.6 9.6 L12 14.3 L16.4 9.6"/>
          <path d="M5.5 19.5 H18.5"/>
        </g>
      </svg>
      <span>The Daily Downlink</span>
    </a>
    {%- if live.size > 0 %}
    <p class="station">Last pass <time datetime="{{ live.first.date | date_to_xmlschema }}">{{ live.first.date | date: "%Y-%m-%d" }}</time></p>
    {%- endif %}
    <nav aria-label="Primary">
      <a href="{{ '/about/' | relative_url }}">About</a>
      <a href="{{ '/feed.xml' | relative_url }}">RSS</a>
    </nav>
  </div>
</header>
